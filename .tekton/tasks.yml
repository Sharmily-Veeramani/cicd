- name: cleanup
  taskSpec:
    steps:
      - name: remove-workspace-files
        image: alpine
        script: |
          #!/bin/sh
          rm -rf "$(workspaces.source.path)"/*
          rm -rf "$(workspaces.source.path)"/.[!.]*
          rm -rf "$(workspaces.source.path)"/..?*
    workspaces:
      - name: source